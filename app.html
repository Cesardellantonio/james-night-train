<title>James's Night Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0b1030;
    --ink: #ece7ff;
    --muted: #a9a4d4;
    --glow: #ffd58a;
    --pill: rgba(236, 231, 255, 0.09);
    --pill-line: rgba(236, 231, 255, 0.2);
    --pill-on: rgba(255, 213, 138, 0.16);
    --card: rgba(16, 20, 56, 0.72);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
    cursor: pointer;
  }
  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 20px;
    right: 20px;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(22px, 3.2vw, 32px);
    font-weight: 800;
    line-height: 1.1;
    color: var(--glow);
    text-wrap: balance;
  }
  .title p { margin: 2px 0 0; font-size: 16px; color: var(--muted); }
  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    transition: opacity 1.2s ease;
  }
  body.idle .controls, body.idle .title { opacity: 0.14; }
  body.asleep .controls, body.asleep .title { opacity: 0; }
  body.prestart .controls, body.prestart .title { opacity: 0; pointer-events: none; }
  .controls button {
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    background: var(--pill);
    border: 1px solid var(--pill-line);
    border-radius: 999px;
    height: 50px;
    padding: 0 18px 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .controls button:hover { background: rgba(236, 231, 255, 0.15); }
  button:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  .controls button[aria-pressed="true"] {
    background: var(--pill-on);
    border-color: rgba(255, 213, 138, 0.55);
    color: var(--glow);
  }
  .controls svg { width: 22px; height: 22px; flex: none; }
  .tnum { font-variant-numeric: tabular-nums; }

  .start {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-inline: 16px;
    background: radial-gradient(ellipse at center, rgba(6, 9, 30, 0.35), rgba(6, 9, 30, 0.75));
    transition: opacity 1s ease;
  }
  .start.gone { opacity: 0; pointer-events: none; }
  .start-card {
    width: min(440px, 100%);
    box-sizing: border-box;
    text-align: center;
    padding: 30px 24px 26px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--pill-line);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .start-card .for { margin: 0; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .start-card h2 { margin: 0; font-size: clamp(56px, 14vw, 88px); font-weight: 800; line-height: 1; color: var(--glow); }
  .start-card p { margin: 10px 0 0; font-size: 18px; line-height: 1.4; }
  .start-card small { display: block; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .go {
    margin-top: 22px;
    font: inherit;
    font-size: 24px;
    font-weight: 800;
    color: #2a2152;
    background: var(--glow);
    border: 0;
    border-radius: 999px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 0 36px rgba(255, 213, 138, 0.45);
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.05); box-shadow: 0 0 52px rgba(255, 213, 138, 0.65); } }

  .goodnight {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease;
    text-align: center;
    padding-inline: 16px;
  }
  .goodnight.show { opacity: 1; }
  .goodnight strong { display: block; font-size: clamp(34px, 7vw, 64px); font-weight: 800; color: var(--glow); line-height: 1.05; }
  .goodnight span { display: block; margin-top: 8px; font-size: 16px; color: var(--muted); }

  @media (max-width: 520px) {
    .controls button { padding: 0 14px; height: 48px; }
    .controls button .lbl { display: none; }
    .controls #sleepBtn .lbl { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) { .go { animation: none; } }
</style>

<canvas id="scene" role="img" aria-label="James's little steam train rolling through a moonlit countryside at night"></canvas>

<header class="title" id="title">
  <h1>James's Night Train</h1>
  <p id="status" aria-live="polite">Waiting at James Junction</p>
</header>

<div class="goodnight" id="goodnight">
  <div><strong>Goodnight, James</strong><span>Tap to wake the train</span></div>
</div>

<nav class="controls" id="controls" aria-label="Train controls">
  <button id="soundBtn" type="button" aria-pressed="false" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <span class="lbl" id="soundLabel">Sound off</span>
  </button>
  <button id="snowBtn" type="button" aria-pressed="false" aria-label="Snow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></svg>
    <span class="lbl">Snow</span>
  </button>
  <button id="sleepBtn" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span class="lbl tnum" id="sleepLabel">Sleep timer</span>
  </button>
  <button id="fsBtn" type="button" aria-label="Full screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="lbl">Full screen</span>
  </button>
</nav>

<div class="start" id="start">
  <div class="start-card">
    <p class="for">Tonight's train is for</p>
    <h2>James</h2>
    <p>The little night train is waiting at James Junction.</p>
    <button class="go" id="startBtn" type="button">All aboard!</button>
    <small>Turn the volume up. Tap the train, the moon, the sky and the fields.</small>
  </div>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Baloo 2", ui-rounded, system-ui, sans-serif';

  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };

  // ---------- journey layout (world units along the track) ----------
  const STEP = 9000;                 // one station, one bridge, one sheep field per stretch
  const BR_START = 3400, BR_END = 4300;
  const SHEEP_AT = 6300;
  const BRAKE = 460;
  const STATIONS = ['James Junction', 'Teddy Town', 'Starlight Hill', 'Moonbeam Bay', 'Pillow Park', 'Dreamland'];
  const BASE_SPEED = reduceMotion ? 60 : 105;

  // ---------- state ----------
  let W = 0, H = 0, S = 1, groundY = 0;
  let stars = [], clouds = [], flies = [], snow = [];
  let t = 0, camX = 0, speedMul = 0;
  let started = false, phase = 'dwell', dwellUntil = Infinity, stationN = 0;
  let puffs = [], sparkles = [], shooters = [], floaters = [], nextShoot = 10, puffTimer = 0;
  let sleepMinutes = 0, sleepStart = 0, sleepP = 0, asleep = false, asleepAt = 0, dim = 0;
  let snowOn = false, snowAmt = 0, moonTapAt = -10, sheepCount = 0, lastSheepK = -1, lastOwl = null;
  let trainBox = { x: 0, y: 0, w: 0, h: 0 }, moonPos = { x: 0, y: 0, r: 0 };
  const bridgeSpans = [];

  const stopCam = n => n * STEP - (W / 2) / S;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.42, Math.min(W / 820, H / 620));
    groundY = Math.round(H * 0.7);
    const n = Math.min(300, Math.floor(W * H / 4000));
    stars = Array.from({ length: n }, (_, i) => ({
      x: hash(i + 1), y: Math.pow(hash(i + 500), 1.4) * groundY * 0.82,
      r: 0.5 + hash(i + 900) * 1.3, ph: hash(i + 1300) * TAU, sp: 0.6 + hash(i + 1700) * 1.6
    }));
    clouds = Array.from({ length: 5 }, (_, i) => ({ x: hash(i + 40), y: 0.12 + hash(i + 60) * 0.35, s: 0.7 + hash(i + 80) * 0.8 }));
    flies = Array.from({ length: 20 }, (_, i) => ({
      x: hash(i + 200), y: groundY - 70 * S + hash(i + 220) * (H - groundY + 40 * S),
      ph: hash(i + 240) * TAU, sp: 0.4 + hash(i + 260) * 0.8
    }));
    snow = Array.from({ length: Math.min(220, Math.floor(W * H / 6000)) }, (_, i) => ({
      x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.4, sp: 18 + Math.random() * 30, ph: Math.random() * TAU
    }));
    if (phase === 'dwell') camX = stopCam(stationN);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- sky ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#060a22');
    g.addColorStop(0.55, '#131944');
    g.addColorStop(1, '#2e2a60');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY + 2);
    const span = W + 40;
    for (const st of stars) {
      let sx = (st.x * span - camX * 0.012 * S) % span; if (sx < 0) sx += span; sx -= 20;
      const a = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * st.sp + st.ph));
      ctx.fillStyle = `rgba(236,231,255,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(sx, st.y, st.r, 0, TAU); ctx.fill();
    }
  }

  function drawAurora() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - 0.7 * sleepP - (asleep ? 0.2 : 0);
    for (let b = 0; b < 2; b++) {
      const top = groundY * (0.16 + b * 0.13), hgt = groundY * 0.24;
      const g = ctx.createLinearGradient(0, top - 40 * S, 0, top + hgt);
      g.addColorStop(0, 'rgba(90,220,190,0)');
      g.addColorStop(0.3, b ? 'rgba(150,120,240,0.08)' : 'rgba(90,220,190,0.075)');
      g.addColorStop(1, 'rgba(140,110,230,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let sx = 0; sx <= W + 16; sx += 16) {
        const y = top + Math.sin(sx * 0.004 + t * 0.12 + b * 2) * 30 * S + Math.sin(sx * 0.011 - t * 0.2 + b) * 12 * S;
        sx === 0 ? ctx.moveTo(sx, y) : ctx.lineTo(sx, y);
      }
      for (let sx = W + 16; sx >= 0; sx -= 16) ctx.lineTo(sx, top + hgt + Math.sin(sx * 0.006 + t * 0.1 + b) * 20 * S);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMoon() {
    const r = Math.max(26, 36 * S);
    const mx = W * (0.8 - 0.3 * sleepP), my = Math.max(r + 80, H * 0.17);
    moonPos = { x: mx, y: my, r };
    const g = ctx.createRadialGradient(mx, my, r * 0.8, mx, my, r * 4);
    g.addColorStop(0, 'rgba(255,236,186,0.22)');
    g.addColorStop(1, 'rgba(255,236,186,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mx, my, r * 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f6e8bd';
    ctx.beginPath(); ctx.arc(mx, my, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(214,190,130,0.35)';
    ctx.beginPath(); ctx.arc(mx + r * 0.45, my - r * 0.45, r * 0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx - r * 0.5, my + r * 0.5, r * 0.11, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a88a52'; ctx.fillStyle = '#6d5530';
    ctx.lineWidth = Math.max(2, r * 0.07); ctx.lineCap = 'round';
    const awake = t - moonTapAt < 1.6;
    for (const side of [-1, 1]) {
      const ex = mx + side * r * 0.35, ey = my - r * 0.05;
      if (awake && side === -1) { ctx.beginPath(); ctx.arc(ex, ey, r * 0.1, 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(ex, ey, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
    }
    ctx.beginPath(); ctx.arc(mx, my + r * 0.24, r * (awake ? 0.22 : 0.14), 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(240,150,140,0.35)';
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.arc(mx + side * r * 0.55, my + r * 0.2, r * 0.12, 0, TAU); ctx.fill(); }
  }

  function drawClouds() {
    for (const c of clouds) {
      const span = W + 400;
      let cx = (c.x * span - camX * 0.04 * S) % span; if (cx < 0) cx += span; cx -= 200;
      const cy = c.y * groundY, s = c.s * S * 60;
      ctx.fillStyle = 'rgba(170,165,230,0.07)';
      for (const [dx, dy, k] of [[0, 0, 1], [0.9, 0.15, 0.75], [-0.9, 0.2, 0.7], [1.7, 0.3, 0.5], [-1.6, 0.35, 0.45]]) {
        ctx.beginPath(); ctx.ellipse(cx + dx * s, cy + dy * s, k * s * 1.3, k * s * 0.7, 0, 0, TAU); ctx.fill();
      }
    }
  }

  function updateShooters(dt) {
    if (!reduceMotion && !asleep && started) {
      nextShoot -= dt;
      if (nextShoot <= 0) {
        shooters.push({ x: W * (0.1 + Math.random() * 0.5), y: groundY * (0.05 + Math.random() * 0.25), life: 0 });
        nextShoot = 12 + Math.random() * 18;
      }
    }
    for (const s of shooters) s.life += dt;
    shooters = shooters.filter(s => s.life < 1.3);
    for (const s of shooters) {
      const k = s.life / 1.3;
      const len = 120 * S, hx = s.x + k * 260 * S, hy = s.y + k * 110 * S;
      const g = ctx.createLinearGradient(hx - len, hy - len * 0.42, hx, hy);
      g.addColorStop(0, 'rgba(255,240,210,0)');
      g.addColorStop(1, `rgba(255,240,210,${(Math.sin(k * Math.PI) * 0.9).toFixed(3)})`);
      ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - len, hy - len * 0.42); ctx.lineTo(hx, hy); ctx.stroke();
    }
  }

  // ---------- hills, houses, trees ----------
  function ridge(wx, seed) {
    return Math.sin(wx * 0.0017 + seed) * 0.5 + Math.sin(wx * 0.0041 + seed * 2.3) * 0.3 + Math.sin(wx * 0.0097 + seed * 0.7) * 0.2;
  }
  const ridgeY = (wx, seed, base, amp) => base - (ridge(wx, seed) * 0.5 + 0.5) * amp;
  function drawRidge(par, base, amp, color, seed) {
    const off = camX * par;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let sx = 0; sx <= W + 8; sx += 8) ctx.lineTo(sx, ridgeY(off + sx / S, seed, base, amp));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  function drawHousesOnHills(par, base, amp, seed) {
    const off = camX * par, SEG = 260;
    const k0 = Math.floor(off / SEG) - 1, k1 = Math.floor((off + W / S) / SEG) + 1;
    for (let k = k0; k <= k1; k++) {
      if (hash(k) > 0.42) continue;
      const hx = k * SEG + hash(k + 99) * 120;
      const x = (hx - off) * S, y = ridgeY(hx, seed, base, amp) + 4 * S;
      const w = 26 * S, h = 18 * S;
      ctx.fillStyle = '#161b44';
      ctx.fillRect(x - w / 2, y - h, w, h + 6 * S);
      ctx.beginPath(); ctx.moveTo(x - w / 2 - 4 * S, y - h); ctx.lineTo(x, y - h - 15 * S); ctx.lineTo(x + w / 2 + 4 * S, y - h); ctx.fill();
      const lit = !asleep && hash(k + 7) > (sleepMinutes ? sleepP * 1.05 : 0.1);
      ctx.fillStyle = lit ? '#ffcf7a' : '#252a58';
      if (lit) { ctx.shadowColor = 'rgba(255,200,110,0.8)'; ctx.shadowBlur = 10 * S; }
      ctx.fillRect(x - 3.5 * S, y - h + 5 * S, 7 * S, 7 * S);
      ctx.shadowBlur = 0;
    }
  }

  function pine(x, y, h) {
    const w = h * 0.42;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const ty = y - h + i * h * 0.26, by = ty + h * 0.45, ww = w * (0.55 + i * 0.25);
      ctx.moveTo(x, ty); ctx.lineTo(x + ww, by); ctx.lineTo(x - ww, by); ctx.closePath();
    }
    ctx.fill();
    ctx.fillRect(x - h * 0.03, y - h * 0.2, h * 0.06, h * 0.2);
  }
  function drawTrees(par, spacing, color, minH, varH, baseY, prob) {
    const off = camX * par;
    const k0 = Math.floor(off / spacing) - 1, k1 = Math.floor((off + W / S) / spacing) + 2;
    ctx.fillStyle = color;
    for (let k = k0; k <= k1; k++) {
      if (hash(k * 3.1 + par) > prob) continue;
      const tx = k * spacing + hash(k + 55) * spacing * 0.6;
      pine((tx - off) * S, baseY, (minH + hash(k + 71) * varH) * S);
    }
    // snow caps
    if (snowAmt > 0.02) {
      ctx.fillStyle = `rgba(230,232,255,${(0.55 * snowAmt).toFixed(3)})`;
      for (let k = k0; k <= k1; k++) {
        if (hash(k * 3.1 + par) > prob) continue;
        const tx = k * spacing + hash(k + 55) * spacing * 0.6, h = (minH + hash(k + 71) * varH) * S, x = (tx - off) * S;
        ctx.beginPath(); ctx.moveTo(x, baseY - h); ctx.lineTo(x + h * 0.1, baseY - h * 0.85); ctx.lineTo(x - h * 0.1, baseY - h * 0.85); ctx.fill();
      }
    }
  }

  // an owl in a bare tree, now and then
  const OWL_STEP = 5200;
  function drawOwls() {
    const par = 0.5, off = camX * par;
    const k0 = Math.floor(off / OWL_STEP) - 1, k1 = Math.floor((off + W / S) / OWL_STEP) + 1;
    for (let k = k0; k <= k1; k++) {
      const ox = k * OWL_STEP + 2600, x = (ox - off) * S, base = groundY - 5 * S;
      if (x < -200 * S || x > W + 200 * S) continue;
      ctx.strokeStyle = '#141939'; ctx.lineCap = 'round';
      ctx.lineWidth = 12 * S;
      ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x - 4 * S, base - 180 * S); ctx.stroke();
      ctx.lineWidth = 6 * S;
      ctx.beginPath(); ctx.moveTo(x - 2 * S, base - 120 * S); ctx.quadraticCurveTo(x + 40 * S, base - 130 * S, x + 70 * S, base - 150 * S); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 3 * S, base - 150 * S); ctx.lineTo(x - 45 * S, base - 185 * S); ctx.stroke();
      const bx = x + 38 * S, by = base - 132 * S;
      ctx.fillStyle = '#4d4270';
      ctx.beginPath(); ctx.ellipse(bx, by - 14 * S, 12 * S, 16 * S, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 11 * S, by - 24 * S); ctx.lineTo(bx - 8 * S, by - 36 * S); ctx.lineTo(bx - 2 * S, by - 27 * S); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx + 11 * S, by - 24 * S); ctx.lineTo(bx + 8 * S, by - 36 * S); ctx.lineTo(bx + 2 * S, by - 27 * S); ctx.fill();
      const blink = asleep || (t + k * 1.7) % 4 < 0.18;
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#e9e4ff';
        ctx.beginPath(); ctx.arc(bx + s * 5 * S, by - 20 * S, 4.2 * S, 0, TAU); ctx.fill();
        ctx.fillStyle = blink ? '#4d4270' : '#ffc857';
        ctx.beginPath(); ctx.arc(bx + s * 5 * S, by - 20 * S, (blink ? 4.4 : 2.6) * S, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#e2a93f';
      ctx.beginPath(); ctx.moveTo(bx - 2 * S, by - 15 * S); ctx.lineTo(bx + 2 * S, by - 15 * S); ctx.lineTo(bx, by - 11 * S); ctx.fill();
      if (lastOwl !== k && x < W * 0.62 && x > W * 0.3) { lastOwl = k; owlHoot(); }
    }
  }

  // ---------- ground, track, bridges ----------
  function drawGroundAndTrack() {
    ctx.fillStyle = mix('#0e1230', '#5d6290', snowAmt * 0.55);
    ctx.fillRect(0, groundY - 6 * S, W, H - groundY + 6 * S);
    ctx.fillStyle = '#161a3c';
    ctx.fillRect(0, groundY - 1 * S, W, 12 * S);
    const sp = 26, off = camX % sp;
    ctx.fillStyle = '#2c3160';
    for (let wx = -off - sp; wx * S < W + sp * S; wx += sp) ctx.fillRect(wx * S, groundY + 1 * S, 13 * S, 5 * S);
    ctx.fillStyle = '#7d82b6';
    ctx.fillRect(0, groundY - 1.5 * S, W, 3 * S);
  }

  function drawBridges() {
    bridgeSpans.length = 0;
    const n0 = Math.floor((camX - BR_END) / STEP), n1 = Math.floor((camX + W / S) / STEP) + 1;
    for (let n = n0; n <= n1; n++) {
      const a = n * STEP + BR_START, b = n * STEP + BR_END;
      const sx0 = (a - camX) * S, sx1 = (b - camX) * S;
      if (sx1 < 0 || sx0 > W) continue;
      bridgeSpans.push([sx0, sx1]);
      const deckTop = groundY + 6 * S, deckBot = groundY + 18 * S, wy = groundY + (H - groundY) * 0.5;
      ctx.fillStyle = '#0a0e2b';
      ctx.fillRect(sx0, deckTop, sx1 - sx0, H - deckTop);
      const wg = ctx.createLinearGradient(0, wy, 0, H);
      wg.addColorStop(0, '#1b2358'); wg.addColorStop(1, '#0a0e2a');
      ctx.fillStyle = wg;
      ctx.fillRect(sx0, wy, sx1 - sx0, H - wy);
      // moon on the water
      if (moonPos.x > sx0 && moonPos.x < sx1) {
        for (let j = 0; j < 9; j++) {
          const w = (26 - j * 2) * S * (1 + 0.35 * Math.sin(t * 2 + j));
          ctx.fillStyle = `rgba(246,232,189,${(0.4 - j * 0.035).toFixed(3)})`;
          ctx.fillRect(moonPos.x - w / 2, wy + 8 * S + j * 9 * S, w, 2 * S);
        }
      }
      // ripples
      ctx.fillStyle = 'rgba(190,190,240,0.16)';
      const width = sx1 - sx0;
      for (let i = 0; i < 16; i++) {
        let x = (hash(i + n * 7) * width + t * 10 * S * (i % 2 ? 1 : -1)) % width; if (x < 0) x += width;
        ctx.fillRect(sx0 + x, wy + 6 * S + i * ((H - wy) / 17), (16 + hash(i + 3) * 30) * S, 1.5 * S);
      }
      // stone arches
      const piers = [a + 150, a + 450, a + 750].map(p => (p - camX) * S);
      const edges = [sx0, ...piers, sx1];
      const archH = (wy - deckBot) * 0.62;
      ctx.fillStyle = '#2b305e';
      for (let i = 0; i < edges.length - 1; i++) {
        const g0 = edges[i], g1 = edges[i + 1], mid = (g0 + g1) / 2, rx = (g1 - g0) / 2 - 15 * S;
        ctx.beginPath();
        ctx.rect(g0, deckBot, g1 - g0, archH);
        ctx.moveTo(mid - Math.max(4, rx), deckBot + archH);
        ctx.ellipse(mid, deckBot + archH, Math.max(4, rx), archH * 0.8, 0, Math.PI, TAU, false);
        ctx.fill('evenodd');
      }
      for (const p of piers) ctx.fillRect(p - 15 * S, deckBot, 30 * S, wy - deckBot + 10 * S);
      ctx.fillStyle = '#3a4078';
      ctx.fillRect(sx0, deckTop, sx1 - sx0, deckBot - deckTop);
      // banks
      ctx.fillStyle = '#0e1230';
      ctx.beginPath(); ctx.moveTo(sx0, deckBot); ctx.lineTo(sx0 + 90 * S, H); ctx.lineTo(sx0 - 2, H); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx1, deckBot); ctx.lineTo(sx1 - 90 * S, H); ctx.lineTo(sx1 + 2, H); ctx.closePath(); ctx.fill();
    }
  }
  const overBridge = x => bridgeSpans.some(([a, b]) => x > a && x < b);

  // ---------- stations ----------
  function drawStations() {
    const n0 = Math.floor((camX - 600) / STEP), n1 = Math.floor((camX + W / S + 600) / STEP);
    for (let n = n0; n <= n1; n++) {
      const cx = (n * STEP - camX) * S;
      if (cx < -500 * S || cx > W + 500 * S) continue;
      const base = groundY - 2 * S;
      const u = v => v * S;
      // building
      ctx.fillStyle = '#262b62';
      ctx.fillRect(cx - u(150), base - u(230), u(300), u(230));
      ctx.fillStyle = '#1b1f4d';
      ctx.beginPath(); ctx.moveTo(cx - u(172), base - u(228)); ctx.lineTo(cx, base - u(300)); ctx.lineTo(cx + u(172), base - u(228)); ctx.closePath(); ctx.fill();
      // upper windows
      for (const wx of [-110, -60, 40, 90]) {
        ctx.save();
        const lit = !asleep;
        if (lit) { ctx.shadowColor = 'rgba(255,200,110,0.85)'; ctx.shadowBlur = u(14); }
        ctx.fillStyle = lit ? '#ffd58a' : '#34305e';
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx + u(wx), base - u(205), u(22), u(30), u(11)); ctx.fill(); }
        else ctx.fillRect(cx + u(wx), base - u(205), u(22), u(30));
        ctx.restore();
      }
      // clock showing the real time
      const now = new Date(), cr = u(20), ccy = base - u(248);
      ctx.fillStyle = '#f3ecd2';
      ctx.beginPath(); ctx.arc(cx, ccy, cr, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#2b2350'; ctx.lineCap = 'round';
      const hA = ((now.getHours() % 12) + now.getMinutes() / 60) / 12 * TAU - Math.PI / 2;
      const mA = (now.getMinutes() + now.getSeconds() / 60) / 60 * TAU - Math.PI / 2;
      ctx.lineWidth = u(3); ctx.beginPath(); ctx.moveTo(cx, ccy); ctx.lineTo(cx + Math.cos(hA) * cr * 0.5, ccy + Math.sin(hA) * cr * 0.5); ctx.stroke();
      ctx.lineWidth = u(2); ctx.beginPath(); ctx.moveTo(cx, ccy); ctx.lineTo(cx + Math.cos(mA) * cr * 0.78, ccy + Math.sin(mA) * cr * 0.78); ctx.stroke();
      // name board on the roof
      const name = STATIONS[((n % STATIONS.length) + STATIONS.length) % STATIONS.length];
      ctx.font = `800 ${u(24)}px ${FONT}`;
      const tw = ctx.measureText(name).width + u(36);
      ctx.fillStyle = '#e2b458';
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx - tw / 2, base - u(348), tw, u(40), u(10)); ctx.fill(); }
      else ctx.fillRect(cx - tw / 2, base - u(348), tw, u(40));
      ctx.fillStyle = '#1b1f4d';
      ctx.fillRect(cx - tw / 2 + u(20), base - u(308), u(5), u(10));
      ctx.fillRect(cx + tw / 2 - u(25), base - u(308), u(5), u(10));
      ctx.fillStyle = '#2b2350';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(name, cx, base - u(327));
      // platform
      ctx.fillStyle = '#3a3f74';
      ctx.fillRect(cx - u(420), base - u(16), u(840), u(16));
      ctx.fillStyle = '#e2b458';
      ctx.fillRect(cx - u(420), base - u(17), u(840), u(3));
      // lamp posts
      for (const lx of [-380, -250, 250, 380]) {
        const x = cx + u(lx), top = base - u(215);
        ctx.fillStyle = '#1b1f4d';
        ctx.fillRect(x - u(3), top, u(6), u(200));
        const lg = ctx.createRadialGradient(x, top, 0, x, top, u(70));
        lg.addColorStop(0, `rgba(255,214,140,${asleep ? 0.1 : 0.45})`);
        lg.addColorStop(1, 'rgba(255,214,140,0)');
        ctx.fillStyle = lg;
        ctx.beginPath(); ctx.arc(x, top, u(70), 0, TAU); ctx.fill();
        ctx.fillStyle = asleep ? '#4a4670' : '#ffe2a8';
        ctx.beginPath(); ctx.arc(x, top, u(8), 0, TAU); ctx.fill();
      }
    }
  }

  // ---------- sheep ----------
  function sheep(x, y, s, legsTucked, face) {
    ctx.fillStyle = '#e9e6f7';
    for (const [dx, dy, r] of [[-9, 0, 9], [0, -4, 10], [9, 0, 9], [-4, 5, 8], [5, 5, 8]]) {
      ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = '#3b3560'; ctx.lineWidth = 2.6 * s; ctx.lineCap = 'round';
    const L = legsTucked ? 5 : 10;
    ctx.beginPath();
    for (const lx of [-8, -3, 4, 9]) { ctx.moveTo(x + lx * s, y + 10 * s); ctx.lineTo(x + lx * s + (legsTucked ? 3 * s : 0), y + (10 + L) * s); }
    ctx.stroke();
    ctx.fillStyle = '#3b3560';
    ctx.beginPath(); ctx.ellipse(x + 16 * s, y - 1 * s, 6 * s, 7.5 * s, 0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 12 * s, y - 7 * s, 3.5 * s, 2 * s, -0.5, 0, TAU); ctx.fill();
    if (face) {
      ctx.strokeStyle = '#e9e6f7'; ctx.lineWidth = 1.2 * s;
      ctx.beginPath(); ctx.arc(x + 18 * s, y - 3 * s, 1.6 * s, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
  }

  function drawSheepFields(dt) {
    const n0 = Math.floor((camX - SHEEP_AT - 800) / STEP), n1 = Math.floor((camX + W / S) / STEP) + 1;
    for (let n = n0; n <= n1; n++) {
      const fw = n * STEP + SHEEP_AT, fx = (fw - camX) * S;
      if (fx < -400 * S || fx > W + 400 * S) continue;
      const fy = groundY + (H - groundY) * 0.52;
      const s = S * 0.95;
      // fence
      ctx.strokeStyle = '#6b5a8e'; ctx.lineCap = 'round';
      ctx.lineWidth = 4 * s;
      for (let px = -60; px <= 60; px += 30) { ctx.beginPath(); ctx.moveTo(fx + px * s, fy + 22 * s); ctx.lineTo(fx + px * s, fy - 16 * s); ctx.stroke(); }
      ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.moveTo(fx - 66 * s, fy - 8 * s); ctx.lineTo(fx + 66 * s, fy - 8 * s); ctx.moveTo(fx - 66 * s, fy + 6 * s); ctx.lineTo(fx + 66 * s, fy + 6 * s); ctx.stroke();
      // the jumping line of sheep
      const P = 2.2, k = Math.floor(t / P), ph = (t / P) % 1;
      sheep(fx - 170 * s, fy + 4 * s + Math.sin(t * 3) * 0.8 * s, s, false, true);
      const walk = clamp(ph / 0.35);
      const jx = ph < 0.35 ? -120 + walk * 55 : -65 + clamp((ph - 0.35) / 0.4) * 140;
      const jy = ph < 0.35 ? 0 : -Math.sin(clamp((ph - 0.35) / 0.4) * Math.PI) * 58;
      sheep(fx + jx * s, fy + 4 * s + jy * s, s, jy < -4, true);
      if (ph > 0.75) {
        ctx.globalAlpha = 1 - clamp((ph - 0.75) / 0.25);
        sheep(fx + (75 + (ph - 0.75) * 160) * s, fy + 4 * s, s, false, true);
        ctx.globalAlpha = 1;
      }
      if (ph > 0.55 && lastSheepK !== k && fx > 0 && fx < W && started) {
        lastSheepK = k; sheepCount++;
        floaters.push({ wx: fw + 5, y: fy - 80 * s, text: String(sheepCount), life: 0 });
        chime(sheepCount % 5);
      }
    }
  }

  function drawFloaters(dt) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floaters) f.life += dt;
    floaters = floaters.filter(f => f.life < 2.2);
    for (const f of floaters) {
      ctx.globalAlpha = Math.sin(clamp(f.life / 2.2) * Math.PI);
      ctx.font = `800 ${Math.round(34 * S)}px ${FONT}`;
      ctx.fillStyle = '#ffd58a';
      ctx.fillText(f.text, (f.wx - camX) * S, f.y - f.life * 22 * S);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- small life ----------
  function drawForeground() {
    const off = camX * 1.3, SEG = 55;
    const y0 = groundY + (H - groundY) * 0.55;
    const k0 = Math.floor(off / SEG) - 1, k1 = Math.floor((off + W / S) / SEG) + 1;
    ctx.strokeStyle = mix('#1d2250', '#8a8fc0', snowAmt * 0.6);
    ctx.lineWidth = 2.2 * S; ctx.lineCap = 'round';
    for (let k = k0; k <= k1; k++) {
      if (hash(k + 3) > 0.6) continue;
      const x = (k * SEG + hash(k + 11) * 30 - off) * S, y = y0 + hash(k + 17) * (H - y0) * 0.6;
      if (overBridge(x)) continue;
      const h = (10 + hash(k + 23) * 14) * S;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 3 * S, y - h * 0.6, x - 6 * S, y - h);
      ctx.moveTo(x, y); ctx.lineTo(x + 1 * S, y - h * 1.1);
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 4 * S, y - h * 0.5, x + 7 * S, y - h * 0.85);
      ctx.stroke();
    }
  }

  function glowDot(x, y, r, rgb, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a.toFixed(3)})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  function drawFireflies() {
    const span = W + 40;
    for (const f of flies) {
      let x = (f.x * span - camX * 0.9 * S + Math.sin(t * f.sp + f.ph) * 14 * S) % span; if (x < 0) x += span; x -= 20;
      const y = f.y + Math.cos(t * f.sp * 0.8 + f.ph) * 10 * S;
      const a = clamp(Math.sin(t * f.sp * 1.3 + f.ph) * 0.8 + 0.2) * (asleep ? 0.3 : 1) * (1 - snowAmt * 0.8);
      if (a > 0.02) glowDot(x, y, 9 * S, '255,236,150', a * 0.9);
    }
  }

  function drawSparkles(dt) {
    for (const p of sparkles) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
    sparkles = sparkles.filter(p => p.life < p.max);
    for (const p of sparkles) {
      const a = 1 - p.life / p.max;
      glowDot(p.x, p.y, p.r * S, p.rgb, a);
    }
  }
  function burst(x, y, rgb, count, spread, g = 0) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU, v = (0.3 + Math.random()) * spread * S;
      sparkles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (g ? 30 * S : 0), g: g * S, life: 0, max: 1.2 + Math.random() * 1.2, r: 6 + Math.random() * 6, rgb });
    }
  }

  function drawSnow(dt) {
    snowAmt += ((snowOn ? 1 : 0) - snowAmt) * Math.min(1, dt * 0.25);
    if (snowAmt < 0.01) return;
    const drift = BASE_SPEED * speedMul * 0.35 * S;
    ctx.fillStyle = `rgba(240,240,255,${(0.85 * snowAmt).toFixed(3)})`;
    for (const f of snow) {
      f.y += f.sp * S * dt * (reduceMotion ? 0.5 : 1);
      f.x += (Math.sin(t * 0.8 + f.ph) * 12 * S - drift * (f.r / 2)) * dt;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x < -4) f.x += W + 8; else if (f.x > W + 4) f.x -= W + 8;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * Math.max(0.8, S), 0, TAU); ctx.fill();
    }
  }

  // ---------- train ----------
  const CAR_LEN = 150, GAP = 14, CARS = 3;
  const ENGINE_X = CARS * (CAR_LEN + GAP);
  const TRAIN_LEN = ENGINE_X + 205;
  const carColors = ['#8d6cc6', '#4c9c8b', '#e0a53f'];
  const roofColors = ['#5f4892', '#326b60', '#a8762a'];
  const animals = ['bunny', 'bear', 'cat', 'bear', 'bunny', 'cat', 'cat', 'bunny', 'bear'];

  function rr(x, y, w, h, r, fill) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fillStyle = fill; ctx.fill();
  }
  function wheel(cx, cy, r, ang) {
    ctx.fillStyle = '#353b6a';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#9095c8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#6f74a8'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = ang + k * TAU / 6;
      ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 3), cy + Math.sin(a) * (r - 3));
    }
    ctx.stroke();
    ctx.fillStyle = '#e2b458';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.24, 0, TAU); ctx.fill();
  }
  function lightLevel(idx) {
    if (!asleep) return 1;
    return clamp(1 - (t - (asleepAt + 2.5 + idx * 0.7)) / 0.8);
  }
  function glowWindow(x, y, w, h, L) {
    ctx.save();
    if (L > 0.05) { ctx.shadowColor = `rgba(255,200,110,${(0.9 * L).toFixed(3)})`; ctx.shadowBlur = 16; }
    rr(x, y, w, h, 5, mix('#34305e', '#ffd58a', L));
    ctx.restore();
  }
  function animal(kind, cx, by, L, wave) {
    ctx.fillStyle = mix('#241f45', '#8a5a33', L);
    ctx.beginPath();
    if (kind === 'bunny') {
      ctx.ellipse(cx - 4, by - 17, 2.6, 7, -0.15, 0, TAU);
      ctx.ellipse(cx + 4, by - 17, 2.6, 7, 0.15, 0, TAU);
    } else if (kind === 'bear') {
      ctx.arc(cx - 6, by - 13, 3.2, 0, TAU);
      ctx.arc(cx + 6, by - 13, 3.2, 0, TAU);
    } else {
      ctx.moveTo(cx - 8, by - 9); ctx.lineTo(cx - 6, by - 17); ctx.lineTo(cx - 2, by - 12);
      ctx.moveTo(cx + 8, by - 9); ctx.lineTo(cx + 6, by - 17); ctx.lineTo(cx + 2, by - 12);
    }
    ctx.fill();
    ctx.beginPath(); ctx.arc(cx, by - 7, 8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, by + 4, 11, 7, 0, 0, TAU); ctx.fill();
    if (wave) {
      const a = -1.2 + Math.sin(t * 9) * 0.45;
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx + 8, by); ctx.lineTo(cx + 8 + Math.cos(a) * 11, by + Math.sin(a) * 11); ctx.stroke();
    }
  }

  function carriage(i, winBase, waving) {
    const color = carColors[i % carColors.length], roof = roofColors[i % roofColors.length];
    rr(6, -40, 138, 12, 3, '#262a4d');
    rr(0, -110, CAR_LEN, 72, 10, color);
    rr(-4, -120, CAR_LEN + 8, 13, 6, roof);
    if (snowAmt > 0.02) rr(-2, -124, CAR_LEN + 4, 6, 3, `rgba(235,236,255,${(0.8 * snowAmt).toFixed(3)})`);
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.fillRect(0, -56, CAR_LEN, 6);
    for (let w = 0; w < 3; w++) {
      const wx = 16 + w * 44, wy = -99, L = lightLevel(winBase + w);
      glowWindow(wx, wy, 30, 28, L);
      ctx.save();
      ctx.beginPath(); ctx.rect(wx, wy, 30, 28); ctx.clip();
      if (hash(i * 3 + w + 5) > 0.3) animal(animals[(i * 3 + w) % animals.length], wx + 15, wy + 28, L, waving && w !== 1);
      ctx.restore();
    }
    const a = camX / 14;
    wheel(30, -14, 14, a);
    wheel(120, -14, 14, a + 1);
  }

  function engine(winIdx) {
    const aBig = camX / 22, aSmall = camX / 14;
    rr(0, -48, 190, 16, 4, '#262a4d');
    rr(0, -134, 66, 92, 7, '#3f5aa6');
    rr(-7, -145, 80, 13, 6, '#2c407a');
    if (snowAmt > 0.02) rr(-6, -149, 78, 6, 3, `rgba(235,236,255,${(0.8 * snowAmt).toFixed(3)})`);
    const L = lightLevel(winIdx);
    glowWindow(12, -123, 42, 34, L);
    ctx.save(); ctx.beginPath(); ctx.rect(12, -123, 42, 34); ctx.clip();
    animal('bear', 36, -89, L, phase === 'dwell' && started);
    ctx.fillStyle = mix('#2a2550', '#c0503f', L);
    ctx.beginPath(); ctx.moveTo(26, -108); ctx.lineTo(46, -108); ctx.lineTo(36, -119); ctx.closePath(); ctx.fill();
    ctx.restore();
    // name plate
    rr(8, -82, 50, 17, 4, '#e2b458');
    ctx.fillStyle = '#2b2350';
    ctx.font = `800 13px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('JAMES', 33, -73);
    // boiler
    rr(58, -104, 120, 60, 28, '#cf5a4b');
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (const bx of [92, 126, 158]) ctx.fillRect(bx, -103, 5, 58);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(72, -96, 96, 7);
    ctx.fillStyle = '#e2b458';
    ctx.beginPath(); ctx.ellipse(112, -103, 14, 12, 0, Math.PI, TAU); ctx.fill();
    // bell
    ctx.beginPath(); ctx.moveTo(80, -104); ctx.lineTo(90, -104); ctx.lineTo(88, -116); ctx.lineTo(82, -116); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2f345f';
    ctx.fillRect(143, -128, 16, 26);
    ctx.beginPath(); ctx.moveTo(137, -142); ctx.lineTo(165, -142); ctx.lineTo(159, -128); ctx.lineTo(143, -128); ctx.closePath(); ctx.fill();
    rr(172, -98, 12, 52, 4, '#2f345f');
    ctx.save();
    const HL = lightLevel(winIdx + 1);
    ctx.shadowColor = 'rgba(255,230,160,0.95)'; ctx.shadowBlur = 18 * HL;
    ctx.fillStyle = mix('#4a4670', '#fff0c2', HL);
    ctx.beginPath(); ctx.arc(186, -82, 8, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2f345f';
    ctx.beginPath(); ctx.moveTo(176, -34); ctx.lineTo(204, -34); ctx.lineTo(186, -4); ctx.lineTo(176, -4); ctx.closePath(); ctx.fill();
    wheel(38, -22, 22, aBig);
    wheel(94, -22, 22, aBig);
    wheel(152, -14, 14, aSmall);
    const px = Math.cos(aBig) * 11, py = Math.sin(aBig) * 11;
    ctx.strokeStyle = '#c3c6e8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(38 + px, -22 + py); ctx.lineTo(94 + px, -22 + py); ctx.stroke();
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(94 + px, -22 + py); ctx.lineTo(160, -38); ctx.stroke();
  }

  function drawHeadlightBeam(x0) {
    const L = lightLevel(CARS * 3 + 1);
    if (L <= 0.02) return;
    const hx = x0 + (ENGINE_X + 186) * S, hy = groundY - 82 * S, reach = 520 * S;
    const g = ctx.createLinearGradient(hx, hy, hx + reach, hy);
    g.addColorStop(0, `rgba(255,236,180,${(0.28 * L).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(hx, hy - 6 * S); ctx.lineTo(hx + reach, hy - 70 * S); ctx.lineTo(hx + reach, groundY + 8 * S); ctx.lineTo(hx, hy + 6 * S);
    ctx.closePath(); ctx.fill();
  }

  function emitPuff(kind) {
    if (kind === 'hiss') {
      puffs.push({ x: ENGINE_X + 120 + Math.random() * 60, y: -10, r: 8, life: 0, max: 2, dx: 10 + Math.random() * 30, rise: 14, grow: 16, white: true });
      return;
    }
    const big = kind === 'big';
    puffs.push({ x: ENGINE_X + 151, y: -146, r: big ? 14 : 9, life: 0, max: big ? 3.2 : 4.2, dx: (Math.random() - 0.5) * 6, rise: big ? 34 : 22, grow: big ? 14 : 9, white: big });
  }
  function drawPuffs(dt) {
    for (const p of puffs) {
      p.life += dt;
      p.x -= (BASE_SPEED * speedMul * 0.85 + 6) * dt + p.dx * dt;
      p.y -= p.rise * dt;
      p.r += p.grow * dt;
    }
    puffs = puffs.filter(p => p.life < p.max);
    for (const p of puffs) {
      const a = (p.white ? 0.5 : 0.32) * (1 - p.life / p.max) * clamp(p.life * 4);
      ctx.fillStyle = `rgba(210,206,240,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
  }

  function drawTrain(dt) {
    const x0 = (W - TRAIN_LEN * S) / 2;
    trainBox = { x: x0, y: groundY - 160 * S, w: TRAIN_LEN * S, h: 165 * S };
    drawHeadlightBeam(x0);
    ctx.save();
    ctx.translate(x0, groundY - 1.5 * S);
    ctx.scale(S, S);
    const bob = reduceMotion ? 0 : 0.9 * speedMul;
    const waving = phase === 'dwell' && started && !asleep;
    for (let i = 0; i < CARS; i++) {
      ctx.save();
      ctx.translate(i * (CAR_LEN + GAP), Math.sin(t * 6 + i * 1.7) * bob);
      carriage(i, i * 3, waving);
      ctx.restore();
      ctx.fillStyle = '#262a4d';
      ctx.fillRect(i * (CAR_LEN + GAP) + CAR_LEN - 2, -36, GAP + 4, 5);
    }
    ctx.save();
    ctx.translate(ENGINE_X, Math.sin(t * 7.3) * bob);
    engine(CARS * 3);
    ctx.restore();
    drawPuffs(dt);
    ctx.restore();
  }

  // ---------- audio ----------
  let AC = null, master, musicGain, sfx, noiseBuf, silentEl = null;
  let soundOn = false, schedTimer = null, nextNoteTime = 0, noteIdx = 0, tuneIdx = 0;
  let lastJoint = 0, lastChuff = 0, cricketTimer = 3;
  const C = 0, D = 2, E = 4, F = 5, G = 7, A = 9, B = 11, C2 = 12;
  const TUNES = [
    // Twinkle Twinkle Little Star
    [[C,1],[C,1],[G,1],[G,1],[A,1],[A,1],[G,2],[F,1],[F,1],[E,1],[E,1],[D,1],[D,1],[C,2],
     [G,1],[G,1],[F,1],[F,1],[E,1],[E,1],[D,2],[G,1],[G,1],[F,1],[F,1],[E,1],[E,1],[D,2],
     [C,1],[C,1],[G,1],[G,1],[A,1],[A,1],[G,2],[F,1],[F,1],[E,1],[E,1],[D,1],[D,1],[C,2],[null,3]],
    // Brahms' Lullaby
    [[E,.5],[E,.5],[G,2],[E,.5],[E,.5],[G,2],[E,.5],[G,.5],[C2,1],[B,1.5],[A,.5],[A,1],[G,1],
     [D,.5],[E,.5],[F,1],[D,1],[D,.5],[E,.5],[F,2],[D,.5],[F,.5],[B,.5],[A,.5],[G,1],[B,1],[C2,3],[null,3]]
  ];

  function silentWavURI() {
    const n = 4000, buf = new Uint8Array(44 + n), dv = new DataView(buf.buffer);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    w(36, 'data'); dv.setUint32(40, n, true); buf.fill(128, 44);
    let s = ''; for (let i = 0; i < buf.length; i++) s += String.fromCharCode(buf[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  }

  function ensureAudio() {
    if (AC) return AC;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = 1; master.connect(comp);
    sfx = AC.createGain(); sfx.gain.value = 1; sfx.connect(master);
    musicGain = AC.createGain(); musicGain.gain.value = 0;
    const delay = AC.createDelay(1); delay.delayTime.value = 0.43;
    const fb = AC.createGain(); fb.gain.value = 0.3;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    musicGain.connect(master); musicGain.connect(delay);
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return AC;
  }

  // Must run inside a tap. It wakes the audio engine and, on iPhone, asks for
  // "playback" audio so the ring/silent switch doesn't mute the page.
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!ensureAudio()) return;
    try {
      AC.resume();
      const src = AC.createBufferSource();
      src.buffer = AC.createBuffer(1, 1, 22050);
      src.connect(AC.destination); src.start(0);
    } catch (e) {}
    try {
      if (!silentEl) { silentEl = new Audio(silentWavURI()); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); }
      const p = silentEl.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  const hz = semi => 523.25 * Math.pow(2, semi / 12);
  function musicBoxNote(time, semi, len, dest, peak = 0.26) {
    const f = hz(semi);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, time + len + 1.4);
    g.connect(dest);
    for (const [mul, type, amt] of [[1, 'sine', 1], [2, 'sine', 0.22], [0.5, 'triangle', 0.2]]) {
      const o = AC.createOscillator(), og = AC.createGain();
      o.type = type; o.frequency.value = f * mul; og.gain.value = amt;
      o.connect(og); og.connect(g);
      o.start(time); o.stop(time + len + 1.5);
    }
  }
  function chime(i) {
    if (!soundOn || !AC) return;
    const scale = [C2, D + 12, E + 12, G + 12, A + 12];
    musicBoxNote(AC.currentTime + 0.01, scale[((i % 5) + 5) % 5], 0.4, sfx, 0.18);
  }

  function scheduler() {
    if (!AC) return;
    const beatLen = 0.72 * (1 + 0.35 * sleepP);
    while (nextNoteTime < AC.currentTime + 0.5) {
      const tune = TUNES[tuneIdx];
      const [semi, beats] = tune[noteIdx];
      if (semi !== null) musicBoxNote(nextNoteTime, semi, beats * beatLen, musicGain);
      nextNoteTime += beats * beatLen;
      noteIdx++;
      if (noteIdx >= tune.length) { noteIdx = 0; tuneIdx = (tuneIdx + 1) % TUNES.length; }
    }
  }
  const musicTarget = () => (soundOn && !asleep ? 0.9 * (1 - 0.6 * sleepP) : 0);
  function setMusicLevel(level, secs) {
    if (!AC) return;
    const now = AC.currentTime;
    musicGain.gain.cancelScheduledValues(now);
    musicGain.gain.setValueAtTime(musicGain.gain.value, now);
    musicGain.gain.linearRampToValueAtTime(level, now + secs);
  }
  function startMusic() {
    if (!ensureAudio()) return;
    AC.resume();
    if (!schedTimer) {
      nextNoteTime = AC.currentTime + 0.2;
      schedTimer = setInterval(scheduler, 120);
    }
    setMusicLevel(musicTarget(), 1.5);
  }
  function stopMusic(secs = 1) {
    setMusicLevel(0, secs);
    const timer = schedTimer;
    schedTimer = null;
    setTimeout(() => { clearInterval(timer); }, 0);
  }

  function noise(time, { freq = 2000, q = 1, type = 'bandpass', vol = 0.05, dur = 0.06, attack = 0.002 } = {}) {
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(f); f.connect(g); g.connect(sfx);
    src.start(time, Math.random() * 0.8); src.stop(time + dur + 0.05);
  }
  function tone(time, freq, { type = 'sine', vol = 0.1, attack = 0.01, dur = 0.5, glide = 0 } = {}) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, time);
    if (glide) o.frequency.linearRampToValueAtTime(freq + glide, time + dur);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(sfx);
    o.start(time); o.stop(time + dur + 0.05);
  }

  function trainSounds(dt) {
    if (!soundOn || !AC || asleep) return;
    const now = AC.currentTime, quiet = 1 - 0.5 * sleepP;
    const joint = Math.floor(camX / 420);
    if (joint !== lastJoint) {
      lastJoint = joint;
      if (speedMul > 0.08) {
        const gap = Math.min(0.6, 90 / (BASE_SPEED * speedMul));
        for (const [dt2, v] of [[0, 1], [gap, 0.8]]) {
          noise(now + dt2, { freq: 2300, q: 1.4, vol: 0.09 * v * quiet, dur: 0.06 });
          tone(now + dt2, 85, { vol: 0.08 * v * quiet, attack: 0.003, dur: 0.12 });
        }
      }
    }
    const chuff = Math.floor(camX / 34.5);
    if (chuff !== lastChuff) {
      lastChuff = chuff;
      if (speedMul > 0.12) noise(now, { freq: 900, q: 0.7, vol: 0.035 * speedMul * quiet, attack: 0.02, dur: 0.18 });
    }
    cricketTimer -= dt;
    if (cricketTimer <= 0) {
      cricketTimer = 2.5 + Math.random() * 4;
      const f = 4200 + Math.random() * 600;
      for (let i = 0; i < 3; i++) tone(now + i * 0.09, f, { vol: 0.012 * quiet, attack: 0.005, dur: 0.05 });
    }
  }

  function whistle() {
    if (!soundOn || !AC) return;
    const now = AC.currentTime;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.16, now + 0.08);
    g.gain.setValueAtTime(0.16, now + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    g.connect(lp); lp.connect(sfx);
    const vib = AC.createOscillator(), vibG = AC.createGain();
    vib.frequency.value = 5.5; vibG.gain.value = 5; vib.connect(vibG);
    for (const f of [523, 659, 784]) {
      const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      vibG.connect(o.frequency); o.connect(g); o.start(now); o.stop(now + 1.15);
    }
    vib.start(now); vib.stop(now + 1.15);
    noise(now, { freq: 3000, q: 0.5, vol: 0.04, attack: 0.05, dur: 1.0 });
  }
  function bell() {
    if (!soundOn || !AC) return;
    const now = AC.currentTime;
    for (const d of [0, 0.4]) { tone(now + d, 1318, { vol: 0.09, attack: 0.004, dur: 1.4 }); tone(now + d, 1975, { vol: 0.04, attack: 0.004, dur: 0.9 }); }
  }
  function hiss() { if (soundOn && AC) noise(AC.currentTime, { type: 'highpass', freq: 2500, q: 0.3, vol: 0.05, attack: 0.08, dur: 1.6 }); }
  function owlHoot() {
    if (!soundOn || !AC || asleep) return;
    const now = AC.currentTime;
    for (const [d, f] of [[0, 392], [0.55, 370], [0.8, 370]]) tone(now + d, f, { vol: 0.06, attack: 0.05, dur: 0.35, glide: -25 });
  }
  function twinkle() {
    if (!soundOn || !AC) return;
    const now = AC.currentTime;
    [C2 + 7, C2 + 4, C2, G].forEach((s, i) => musicBoxNote(now + i * 0.09, s, 0.3, sfx, 0.14));
  }

  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^en/i.test(v.lang) && /samantha|karen|moira|serena|female/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!soundOn || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
      if (AC && !asleep) { setMusicLevel(musicTarget() * 0.35, 0.3); u.onend = () => setMusicLevel(musicTarget(), 1.2); }
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- journey ----------
  const statusEl = document.getElementById('status');
  const stationName = n => STATIONS[((n % STATIONS.length) + STATIONS.length) % STATIONS.length];
  function setStatus(txt) { if (statusEl.textContent !== txt) statusEl.textContent = txt; }

  function arrive() {
    phase = 'dwell';
    dwellUntil = t + 8;
    speedMul = 0;
    camX = stopCam(stationN);
    bell(); hiss();
    for (let i = 0; i < 6; i++) setTimeout(() => emitPuff('hiss'), i * 120);
    setStatus(`Now at ${stationName(stationN)}`);
    setTimeout(() => { if (phase === 'dwell' && !asleep) speak(`${stationName(stationN)}!`); }, 900);
  }
  function depart(first) {
    phase = 'run';
    stationN++;
    if (!first) { whistle(); speak('All aboard!'); }
    for (let i = 0; i < 4; i++) setTimeout(() => emitPuff('big'), i * 120);
    setStatus(`Next stop: ${stationName(stationN)}`);
  }

  function updateJourney(dt) {
    const cruise = asleep ? 0 : 1 - 0.55 * sleepP;
    if (phase === 'run') {
      speedMul += (cruise - speedMul) * Math.min(1, dt * (asleep ? 0.35 : 0.8));
      if (stopCam(stationN) - camX < BRAKE) phase = 'arrive';
    }
    if (phase === 'arrive') {
      const d = stopCam(stationN) - camX;
      const v = Math.max(0.05, cruise * Math.sqrt(clamp(d / BRAKE)));
      speedMul = Math.min(speedMul, v);
      if (asleep) speedMul = Math.max(speedMul, 0.04);
      if (d <= 1.5) arrive();
    }
    if (phase === 'dwell') {
      speedMul = 0;
      if (started && t >= dwellUntil && !asleep) depart(false);
    }
    camX += BASE_SPEED * speedMul * dt;
  }

  // ---------- controls ----------
  const soundBtn = document.getElementById('soundBtn');
  const soundLabel = document.getElementById('soundLabel');
  const snowBtn = document.getElementById('snowBtn');
  const sleepBtn = document.getElementById('sleepBtn');
  const sleepLabel = document.getElementById('sleepLabel');
  const fsBtn = document.getElementById('fsBtn');
  const goodnight = document.getElementById('goodnight');
  const startEl = document.getElementById('start');
  const SLEEP_STEPS = [5, 10, 20, 0]; // the timer starts at 5 minutes

  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (!asleep) keepAwake(); if (AC && soundOn) AC.resume(); }
  });

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', String(on));
    soundLabel.textContent = on ? 'Sound on' : 'Sound off';
    if (on) { unlockAudio(); if (!asleep) startMusic(); }
    else { stopMusic(0.6); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    started = true;
    document.body.classList.remove('prestart');
    startEl.classList.add('gone');
    keepAwake();
    setSound(true);
    whistle();
    speak('All aboard, James!');
    setTimeout(() => { if (phase === 'dwell') depart(true); }, 2400);
    sleepMinutes = 5; sleepStart = t; sleepP = 0;
    sleepBtn.setAttribute('aria-pressed', 'true');
    updateSleepLabel();
    poke();
  });

  soundBtn.addEventListener('click', () => { keepAwake(); setSound(!soundOn); });
  snowBtn.addEventListener('click', () => {
    snowOn = !snowOn;
    snowBtn.setAttribute('aria-pressed', String(snowOn));
    twinkle();
  });

  function updateSleepLabel() {
    if (asleep) { sleepLabel.textContent = 'Asleep'; return; }
    if (!sleepMinutes) { sleepLabel.textContent = 'Sleep timer'; return; }
    const left = Math.max(0, Math.ceil(sleepMinutes - (t - sleepStart) / 60));
    sleepLabel.textContent = `${left} min left`;
  }
  sleepBtn.addEventListener('click', () => {
    keepAwake();
    if (asleep) wake();
    const i = SLEEP_STEPS.indexOf(sleepMinutes);
    sleepMinutes = SLEEP_STEPS[(i + 1) % SLEEP_STEPS.length];
    sleepStart = t; sleepP = 0;
    sleepBtn.setAttribute('aria-pressed', String(sleepMinutes > 0));
    setMusicLevel(musicTarget(), 1);
    updateSleepLabel();
  });

  if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    keepAwake();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  function fallAsleep() {
    asleep = true; asleepAt = t;
    sleepBtn.setAttribute('aria-pressed', 'false');
    setMusicLevel(0, 10);
    setTimeout(() => { if (asleep) speak('Goodnight, James. Sweet dreams.'); }, 3500);
    setTimeout(() => { if (asleep) { stopMusic(0.1); goodnight.classList.add('show'); } }, 7000);
    setTimeout(() => { if (asleep) goodnight.classList.remove('show'); }, 15000);
    document.body.classList.add('asleep');
    // the screen is fully dark now, so let the device lock itself when it wants to

    setStatus('Sleeping at the end of the line');
    updateSleepLabel();
  }
  function wake() {
    asleep = false; sleepMinutes = 0; sleepP = 0;
    goodnight.classList.remove('show');
    document.body.classList.remove('asleep');
    sleepBtn.setAttribute('aria-pressed', 'false');
    if (soundOn) startMusic();
    setStatus(phase === 'dwell' ? `Now at ${stationName(stationN)}` : `Next stop: ${stationName(stationN)}`);
    updateSleepLabel();
  }

  cv.addEventListener('pointerdown', e => {
    if (!started) return;
    keepAwake();
    unlockAudio();
    if (asleep) { wake(); return; }
    const x = e.clientX, y = e.clientY;
    const m = moonPos;
    if (Math.hypot(x - m.x, y - m.y) < m.r * 1.4) {
      moonTapAt = t; twinkle();
      burst(m.x, m.y, '255,236,186', 24, 90);
      return;
    }
    const b = trainBox;
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) {
      whistle();
      for (let i = 0; i < 4; i++) setTimeout(() => emitPuff('big'), i * 110);
      return;
    }
    if (y < groundY - 20 * S) {
      shooters.push({ x: x - 130 * S, y: y - 55 * S, life: 0 });
      burst(x, y, '236,231,255', 10, 50);
      chime(Math.floor(Math.random() * 5));
      return;
    }
    burst(x, y, '255,236,150', 14, 70, 20);
    chime(Math.floor(Math.random() * 5));
  });

  let idleTimer = null;
  function poke() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 6000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, poke, { passive: true }));
  document.body.classList.add('prestart');
  if (document.fonts && document.fonts.load) document.fonts.load(`800 20px "Baloo 2"`).catch(() => {});

  // ---------- loop ----------
  let last = performance.now(), labelTimer = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;

    if (sleepMinutes && !asleep) {
      sleepP = clamp((t - sleepStart) / (sleepMinutes * 60));
      if (sleepP >= 1) fallAsleep();
    }
    updateJourney(dt);

    if (phase !== 'dwell' && !asleep && speedMul > 0.1) {
      puffTimer -= dt;
      if (puffTimer <= 0) { emitPuff('small'); puffTimer = 0.42 / speedMul; }
    }

    labelTimer += dt;
    if (labelTimer > 1) {
      labelTimer = 0;
      updateSleepLabel();
      if (soundOn && sleepMinutes && !asleep && !(window.speechSynthesis && speechSynthesis.speaking)) setMusicLevel(musicTarget(), 0.9);
    }
    trainSounds(dt);

    drawSky();
    drawAurora();
    updateShooters(dt);
    drawMoon();
    drawClouds();
    drawRidge(0.08, groundY - 30 * S, 170 * S, mix('#242a5a', '#4a4f82', snowAmt * 0.5), 1.1);
    drawRidge(0.22, groundY - 8 * S, 80 * S, mix('#1b2150', '#3c4175', snowAmt * 0.5), 4.2);
    drawHousesOnHills(0.22, groundY - 8 * S, 80 * S, 4.2);
    drawTrees(0.5, 70, '#131839', 55, 60, groundY - 5 * S, 0.55);
    drawOwls();
    drawGroundAndTrack();
    drawBridges();
    drawStations();
    drawTrain(dt);
    drawSheepFields(dt);
    drawForeground();
    drawFireflies();
    drawFloaters(dt);
    drawSparkles(dt);
    drawSnow(dt);

    // Wind-down: the whole scene fades toward black over the sleep timer,
    // then goes fully dark once the train has stopped.
    const dimTarget = asleep ? 1 : 0.9 * Math.pow(sleepP, 0.85);
    dim += (dimTarget - dim) * Math.min(1, dt * (asleep ? 0.25 : 0.5));
    if (dim > 0.005) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, dim).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
